# SafeSpeak PES reverse proxy with HTTPS (server deployment, docker-compose.prod.yml).
# Certificates are mounted at runtime from deploy/certs/ (git-ignored), e.g. from
# Let's Encrypt: fullchain.pem and privkey.pem. See docs/deployment.md.

limit_req_zone $binary_remote_addr zone=safespeak_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=safespeak_api:10m rate=30r/s;
log_format safespeak '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_tokens off;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_tokens off;
    client_max_body_size 64k;
    access_log /dev/stdout safespeak;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /api/v1/auth/login {
        limit_req zone=safespeak_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }
    location /api/ {
        limit_req zone=safespeak_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }
    location / {
        proxy_pass http://frontend:8080;
        include /etc/nginx/snippets/proxy_headers.conf;
    }
}
