# SafeSpeak PES continuous integration.
# Every push / pull request: backend tests (SQLite + PostgreSQL), ML/data integrity
# (no training), frontend production build, Docker image builds, and a full
# Docker Compose smoke test. Any failure fails the run.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite + PostgreSQL) and ML integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # Throwaway password for an ephemeral CI-only container (not a real secret).
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: safespeak_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Backend tests (SQLite)
        run: python -m pytest -m "not ml_integrity" --junitxml=../reports/pytest-sqlite.xml
      - name: Backend tests (PostgreSQL)
        if: success() || failure()
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-ephemeral-only@localhost:5432/safespeak_test
        run: python -m pytest -m "not ml_integrity" --junitxml=../reports/pytest-postgres.xml
      - name: ML / data integrity (checksums, metadata, model loading, inference smoke)
        if: success() || failure()
        run: python -m pytest -m ml_integrity --junitxml=../reports/pytest-ml-integrity.xml
      - name: Publish test results (run summary + annotations)
        if: always()
        working-directory: .
        run: >-
          python scripts/ci_test_report.py
          "Backend (SQLite)" reports/pytest-sqlite.xml
          "Backend (PostgreSQL)" reports/pytest-postgres.xml
          "ML integrity" reports/pytest-ml-integrity.xml

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker images and Compose smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: >-
          docker buildx build -f backend/Dockerfile -t safespeak-backend:local --load
          --cache-from type=gha,scope=backend --cache-to type=gha,mode=max,scope=backend .
      - name: Build frontend image
        run: >-
          docker buildx build -t safespeak-frontend:local --load
          --cache-from type=gha,scope=frontend --cache-to type=gha,mode=max,scope=frontend frontend
      - name: Image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep safespeak
      - name: Create CI .env (random secrets, never printed)
        run: python scripts/generate_env.py --set TAT_MONITOR_INTERVAL_SECONDS=5
      - name: Start stack (db -> migrate -> backend/frontend -> proxy)
        run: docker compose up -d --no-build
      - name: Wait for healthchecks
        run: |
          for i in $(seq 1 60); do
            migrate=$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' "$(docker compose ps -aq migrate)")
            states=""
            for s in db backend frontend proxy; do
              states="$states $s=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q $s)")"
            done
            echo "migrate: $migrate |$states"
            if [ "$migrate" = "exited 0" ] && [ "$(echo "$states" | grep -o '=healthy' | wc -l)" -eq 4 ]; then
              echo "All services healthy"; exit 0
            fi
            sleep 5
          done
          echo "Services did not become healthy"; exit 1
      - name: Seed base data and demo accounts
        run: docker compose run --rm --no-deps seed
      - name: Smoke test through the reverse proxy
        run: |
          set -a; . ./.env; set +a
          python scripts/smoke_test.py http://localhost:8080 --escalation-wait 60 | tee smoke.txt
          { echo '### Docker Compose smoke test'; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify persistence in PostgreSQL
        run: |
          set -a; . ./.env; set +a
          q() { docker compose exec -T db psql -U "$POSTGRES_SUPERUSER" -d "$APP_DB_NAME" -tAc "$1"; }
          echo "complaints: $(q 'select count(*) from complaints')"
          echo "ai_predictions: $(q 'select count(*) from ai_predictions')"
          echo "complaint_events: $(q 'select count(*) from complaint_events')"
          test "$(q 'select count(*) from complaints')" -ge 2
          test "$(q 'select count(*) from ai_predictions')" -ge 2
          test "$(q "select count(*) from complaint_events where action = 'escalation_triggered' and actor_user_id is null")" -ge 1
      - name: Verify least-privilege app role cannot delete
        run: |
          set -a; . ./.env; set +a
          if docker compose exec -T -e PGPASSWORD="$APP_DB_PASSWORD" db \
               psql -h 127.0.0.1 -U "$APP_DB_USER" -d "$APP_DB_NAME" -c "DELETE FROM complaints" ; then
            echo "app role was able to DELETE"; exit 1
          fi
          echo "DELETE refused for the app role, as intended"
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
