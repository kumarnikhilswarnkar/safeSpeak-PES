# Static file server for the React build (inside the frontend container, port 8080).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/student, /concerns/SSP-...) all load index.html, never cached.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
